services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
      # Frontend calls backend via localhost (from browser perspective)
      - REACT_APP_API_BASE_URL=http://localhost:8000
      - REACT_APP_WEBSOCKET_URL=ws://localhost:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - BACKEND_PORT=3000
      - DATABASE_URL=mysql://user:password@db:3306/testcase_translator
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_TIMEOUT=300000
      - REQUEST_TIMEOUT=300000
      # Force real Cypress execution in Docker environment
      - CYPRESS_FORCE_REAL=true
      - DISPLAY=:99
      - DOCKER=true
    depends_on:
      - db
    networks:
      - app-network
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
      - ./backend/temp:/app/temp
      - /app/node_modules
    # Add shared memory size for Chromium
    shm_size: 2gb

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=testcase_translator
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    command: --default-authentication-plugin=mysql_native_password

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
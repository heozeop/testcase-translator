version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./tsconfig.json:/app/tsconfig.json
      - ./nodemon.json:/app/nodemon.json
      - ./.env:/app/.env
    environment:
      - NODE_ENV=development
      - BACKEND_PORT=8000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=testcase_translator
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Force real Cypress execution in Docker environment
      - CYPRESS_FORCE_REAL=true
      - DISPLAY=:99
      - DOCKER=true
    depends_on:
      - mysql
    networks:
      - app-network
    # Add shared memory size for Chromium
    shm_size: 2gb

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=testcase_translator
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge